    <title>Simple Provider Search</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --muted-color: #94a3b8;
            --border-color: #334155;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted-color);
        }

        input[type="text"] {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .preset-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .preset-chip {
            background-color: var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
        }

        .preset-chip:hover {
            background-color: var(--accent-color);
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Medical Provider Finder</h1>

    <div class="card">
        <div class="preset-bar">
            <button class="preset-chip" onclick="setKeyword('insurance')">Regular Insurance / HMO PPO</button>
            <button class="preset-chip" onclick="setKeyword('workers comp')">Workers' Comp</button>
            <button class="preset-chip" onclick="setKeyword('personal injury')">Personal Injury</button>
            <button class="preset-chip" onclick="setKeyword('cash pay')">Cash Pay</button>
            <button class="preset-chip" onclick="setKeyword('grand opening')">New Practice</button>
        </div>

        <div class="form-group">
            <label for="specialty">Specialty</label>
            <input type="text" id="specialty" list="specialty-list" placeholder="e.g. Chiropractor, Physical Therapy, MD" autocomplete="off">
            <datalist id="specialty-list">
                <option value="Acupuncturist">
                <option value="Anesthesiology">
                <option value="Cardiology">
                <option value="Chiropractor">
                <option value="Dentist">
                <option value="Dermatologist">
                <option value="Emergency Medicine">
                <option value="Endocrinology">
                <option value="Family Medicine">
                <option value="Gastroenterology">
                <option value="General Surgery">
                <option value="Internal Medicine">
                <option value="Massage Therapist">
                <option value="Neurologist">
                <option value="Nurse Practitioner">
                <option value="OB/GYN">
                <option value="Occupational Therapy">
                <option value="Oncology">
                <option value="Ophthalmologist">
                <option value="Optometrist">
                <option value="Orthopedic Surgeon">
                <option value="Pain Management">
                <option value="Pediatrics">
                <option value="Physiatrist (PM&R)">
                <option value="Physical Therapy">
                <option value="Physician Assistant">
                <option value="Podiatrist">
                <option value="Psychiatrist">
                <option value="Pulmonology">
                <option value="Radiology">
                <option value="Rheumatology">
                <option value="Urgent Care">
                <option value="Urology">
            </datalist>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g. Austin TX, Los Angeles, 78701">
        </div>

        <div class="form-group">
            <label for="keyword">Claim Type / Insurance / Keyword</label>
            <input type="text" id="keyword" list="claim-list" placeholder="e.g. regular insurance, HMO, PPO, workers comp" oninput="suggestClaimType(this.value)">
            <datalist id="claim-list">
                <option value="Regular Insurance / HMO / PPO">
                <option value="Commercial Health Insurance">
                <option value="Workers' Comp / Work Injury">
                <option value="Personal Injury / Auto Accident / Lien">
                <option value="QME / IME / Med-Legal">
                <option value="Cash Pay / Self Pay / DPC">
                <option value="Grand Opening / Accepting New Patients">
            </datalist>
        </div>

        <div class="form-group">
            <label for="negatives">Negative Words / Exclusions</label>
            <input type="text" id="negatives" value="-law -attorney -lawyer -legal">
        </div>

        <label class="checkbox-group">
            <input type="checkbox" id="filterJobEngines" checked>
            <span>Exclude Job Engines (LinkedIn, Indeed, Glassdoor, etc.)</span>
        </label>

        <button class="btn-primary" onclick="search()">Search</button>
    </div>
</div>

<script>
    function setKeyword(val) {
        document.getElementById('keyword').value = val;
        suggestClaimType(val);
    }

    // CONTEXTUAL CLAIM & INSURANCE SUGGESTION LOGIC
    function suggestClaimType(val) {
        const clean = val.toLowerCase().trim();
        const datalist = document.getElementById('claim-list');
        
        if (clean.includes('insur') || clean.includes('hmo') || clean.includes('ppo') || clean.includes('regular') || clean.includes('medical insurance')) {
            datalist.innerHTML = `
                <option value="Regular Insurance / HMO / PPO">
                <option value="Accepts Most Major Insurance">
                <option value="In-Network PPO / HMO Provider">
                <option value="Commercial Insurance Accepted">
                <option value="Medicare / Medicaid Accepted">
            `;
        } else if (clean.includes('med legal') || clean.includes('med-legal') || clean.includes('qme') || clean.includes('ime')) {
            datalist.innerHTML = `
                <option value="QME / IME / Med-Legal">
                <option value="Independent Medical Examiner">
                <option value="Qualified Medical Evaluator">
            `;
        } else if (clean.includes('workers') || clean.includes('work comp') || clean.includes('comp')) {
            datalist.innerHTML = `
                <option value="Workers' Comp / Work Injury">
                <option value="Workers Compensation">
                <option value="Occupational Injury">
            `;
        } else if (clean.includes('personal') || clean.includes('pi') || clean.includes('accident')) {
            datalist.innerHTML = `
                <option value="Personal Injury / Auto Accident / Lien">
                <option value="Letter of Protection (LOP)">
                <option value="Medical Lien">
            `;
        } else {
            datalist.innerHTML = `
                <option value="Regular Insurance / HMO / PPO">
                <option value="Workers' Comp / Work Injury">
                <option value="Personal Injury / Auto Accident / Lien">
                <option value="QME / IME / Med-Legal">
                <option value="Cash Pay / Self Pay / DPC">
                <option value="Grand Opening / Accepting New Patients">
            `;
        }
    }

    // BACKEND STRUCTURED ENGINE
    function buildStructuredBackendQuery(rawSpec, rawLoc, rawKw, rawNegatives, filterJobs) {
        let structuredTerms = [];

        // 1. Specialty -> Clinical Term Mapping
        if (rawSpec.trim()) {
            const cleanSpec = rawSpec.trim().toLowerCase();
            const specMap = {
                'chiropractor': '("Chiropractor" OR "Chiropractic Clinic" OR "Chiropractic")',
                'chiro': '("Chiropractor" OR "Chiropractic Clinic")',
                'headache': '("Neurologist" OR "Headache Center" OR "Pain Management")',
                'head hurts': '("Neurologist" OR "Headache Center" OR "Pain Management")',
                'md': '("MD" OR "Physician" OR "Medical Doctor")',
                'doctor': '("MD" OR "Physician" OR "Medical Practice")',
                'physical therapy': '("Physical Therapy" OR "Physical Therapist" OR "PT")',
                'pt': '("Physical Therapy" OR "Physical Therapist")',
                'pain management': '("Pain Management" OR "Pain Medicine Clinic")',
                'orthopedic': '("Orthopedic Surgeon" OR "Orthopedics")'
            };
            structuredTerms.push(specMap[cleanSpec] || `"${rawSpec.trim()}"`);
        }

        // 2. Location
        if (rawLoc.trim()) {
            const cleanLoc = rawLoc.trim().replace(/\s+/g, ' ');
            structuredTerms.push(`"${cleanLoc}"`);
        }

        // 3. Keyword / Insurance / Claim Type Optimization (Site phrasing conversion)
        if (rawKw.trim()) {
            const cleanKw = rawKw.trim().toLowerCase();
            if (cleanKw.includes('insur') || cleanKw.includes('hmo') || cleanKw.includes('ppo') || cleanKw.includes('regular')) {
                structuredTerms.push('("accepts insurance" OR "accepted insurance" OR "in-network" OR "participating provider" OR "insurance plans accepted" OR "HMO" OR "PPO")');
            } else if (cleanKw.includes('workers') || cleanKw.includes('work injury') || cleanKw.includes('comp')) {
                structuredTerms.push('("workers comp" OR "workers compensation" OR "work injury" OR "industrial medicine")');
            } else if (cleanKw.includes('med legal') || cleanKw.includes('qme') || cleanKw.includes('ime')) {
                structuredTerms.push('("QME" OR "IME" OR "med legal" OR "independent medical exam" OR "qualified medical evaluator")');
            } else if (cleanKw.includes('personal injury') || cleanKw.includes('pi') || cleanKw.includes('lien') || cleanKw.includes('accident')) {
                structuredTerms.push('("personal injury" OR "car accident" OR "auto accident" OR "letter of protection" OR "medical lien")');
            } else if (cleanKw.includes('cash') || cleanKw.includes('self pay')) {
                structuredTerms.push('("cash pay" OR "self pay" OR "direct primary care" OR "transparent pricing" OR "no insurance")');
            } else if (cleanKw.includes('grand opening') || cleanKw.includes('new')) {
                structuredTerms.push('("grand opening" OR "now open" OR "accepting new patients")');
            } else {
                const parts = rawKw.split(',').map(k => `"${k.trim()}"`).filter(k => k !== '""');
                structuredTerms.push(parts.length > 1 ? `(${parts.join(' OR ')})` : `"${rawKw.trim()}"`);
            }
        }

        // 4. Structural Page Intent Operators
        structuredTerms.push('(inurl:contact OR inurl:about OR inurl:services OR inurl:insurance OR intitle:clinic OR intitle:practice)');

        // 5. Default Negatives / Exclusions
        if (rawNegatives.trim()) {
            const formattedNegs = rawNegatives.trim().split(' ')
                .map(n => n.startsWith('-') ? n : `-${n}`)
                .join(' ');
            structuredTerms.push(formattedNegs);
        } else {
            structuredTerms.push('-law -attorney -lawyer -legal');
        }

        // 6. Job Engine Filter
        if (filterJobs) {
            structuredTerms.push('-linkedin -indeed -glassdoor -ziprecruiter -monster -simplyhired -jobs');
        }

        // 7. Construct Final udm=14 URL
        const rawQueryString = structuredTerms.join(' ');
        return `https://www.google.com/search?udm=14&q=${encodeURIComponent(rawQueryString)}`;
    }

    function search() {
        const spec = document.getElementById('specialty').value;
        const loc = document.getElementById('location').value;
        const kw = document.getElementById('keyword').value;
        const negs = document.getElementById('negatives').value;
        const filterJobs = document.getElementById('filterJobEngines').checked;

        const targetUrl = buildStructuredBackendQuery(spec, loc, kw, negs, filterJobs);
        window.open(targetUrl, '_blank');
    }
</script>
</body>

        const spec = document.getElementById('specialty').value;
        const loc = document.getElementById('location').value;
        const kw = document.getElementById('keyword').value;
        const negs = document.getElementById('negatives').value;
        const filterJobs = document.getElementById('filterJobEngines').checked;

        const targetUrl = buildStructuredBackendQuery(spec, loc, kw, negs, filterJobs);
        window.open(targetUrl, '_blank');
    }
</script>
