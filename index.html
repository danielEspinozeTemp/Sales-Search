<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Provider Search</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --muted-color: #94a3b8;
            --border-color: #334155;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted-color);
        }

        input[type="text"], select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .preset-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .preset-chip {
            background-color: var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
        }

        .preset-chip:hover {
            background-color: var(--accent-color);
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Medical Provider Finder</h1>

    <div class="card">
        <div class="preset-bar">
            <button class="preset-chip" onclick="setKeyword('Workers\' Compensation / Work Injury')">Workers' Comp</button>
            <button class="preset-chip" onclick="setKeyword('Personal Injury / Auto Accident / Lien')">Personal Injury</button>
            <button class="preset-chip" onclick="setKeyword('Regular Insurance / HMO / PPO')">Regular Insurance</button>
            <button class="preset-chip" onclick="setKeyword('Cash Pay / Self Pay / DPC')">Cash Pay</button>
        </div>

        <div class="form-group">
            <label for="specialty">Specialty</label>
            <input type="text" id="specialty" list="specialty-list" placeholder="e.g. Chiropractor, Physical Therapy, MD" autocomplete="off">
            <datalist id="specialty-list">
                <option value="Acupuncturist">
                <option value="Chiropractor">
                <option value="Dentist">
                <option value="Dermatologist">
                <option value="Family Medicine">
                <option value="Internal Medicine">
                <option value="Neurologist">
                <option value="Occupational Therapy">
                <option value="Orthopedic Surgeon">
                <option value="Pain Management">
                <option value="Physiatrist (PM&R)">
                <option value="Physical Therapy">
                <option value="Podiatrist">
                <option value="Psychiatrist">
                <option value="Urgent Care">
            </datalist>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="state">State</label>
                <select id="state" onchange="updateCities()">
                    <!-- Populated from locations.js -->
                </select>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <select id="city">
                    <!-- Populated from locations.js -->
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="keyword">Claim Type / Insurance / Keyword</label>
            <input type="text" id="keyword" list="claim-list" placeholder="Select or type claim type..." oninput="suggestClaimType(this.value)">
            <datalist id="claim-list">
                <option value="Workers' Compensation / Work Injury">
                <option value="Personal Injury / Auto Accident / Lien">
                <option value="QME / IME / Med-Legal">
                <option value="Regular Insurance / HMO / PPO">
                <option value="Cash Pay / Self Pay / DPC">
            </datalist>
        </div>

        <div class="form-group">
            <label for="negatives">Negative Words / Exclusions</label>
            <input type="text" id="negatives" value="-law -attorney -lawyer -legal">
        </div>

       <label class="checkbox-group">
    <input type="checkbox" id="filterJobEngines" checked>
    <span id="labelJobEngines">Exclude Job Engines (LinkedIn, Indeed, Glassdoor, ZipRecruiter)</span>
</label>

<label class="checkbox-group">
    <input type="checkbox" id="filterDirectories" checked>
    <span id="labelDirectories">Exclude Directories (ZocDoc, Yelp, Healthgrades, Vitals, RateMDs)</span>
</label>

<label class="checkbox-group">
    <input type="checkbox" id="filterSocial">
    <span id="labelSocial">Exclude Social Media (Facebook, Instagram, LinkedIn, Twitter/X)</span>
</label>

<label class="checkbox-group" style="margin-top: 12px; border-top: 1px solid var(--border-color); padding-top: 12px;">
    <input type="checkbox" id="invertFilter" onchange="toggleInvertMode()">
    <span style="color: #38bdf8; font-weight: bold;">Invert Mode (Target Checked Categories ONLY)</span>
</label>

        <button class="btn-primary" onclick="search()">Search</button>
    </div>
</div>

<!-- EXTERNAL LOCATION DATA MODULE -->
<script src="locations.js"></script>

<script>
    function initLocations() {
        const stateSelect = document.getElementById('state');
        stateSelect.innerHTML = '';

        stateList.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.code;
            opt.textContent = `${s.name} (${s.code})`;
            if (s.code === 'CA') opt.selected = true;
            stateSelect.appendChild(opt);
        });
        updateCities();
    }

    function updateCities() {
        const stateSelect = document.getElementById('state').value;
        const citySelect = document.getElementById('city');
        citySelect.innerHTML = '';

        const cities = cityData[stateSelect] || ["All Cities"];
        cities.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c === "All Cities" ? "" : c;
            opt.textContent = c;
            citySelect.appendChild(opt);
        });
    }

    function setKeyword(val) {
        document.getElementById('keyword').value = val;
        suggestClaimType(val);
    }

    function suggestClaimType(val) {
        const clean = val.toLowerCase().trim();
        const datalist = document.getElementById('claim-list');

        if (clean.includes('work') || clean.includes('comp') || clean.includes('job') || clean.includes('industrial')) {
            datalist.innerHTML = `
                <option value="Workers' Compensation / Work Injury">
                <option value="Workmans Comp / Workplace Injury">
                <option value="Occupational Medicine / Industrial Injury">
            `;
        } else if (clean.includes('insur') || clean.includes('hmo') || clean.includes('ppo')) {
            datalist.innerHTML = `
                <option value="Regular Insurance / HMO / PPO">
                <option value="Accepts Commercial Insurance">
                <option value="In-Network Provider">
            `;
        } else {
            datalist.innerHTML = `
                <option value="Workers' Compensation / Work Injury">
                <option value="Personal Injury / Auto Accident / Lien">
                <option value="QME / IME / Med-Legal">
                <option value="Regular Insurance / HMO / PPO">
                <option value="Cash Pay / Self Pay / DPC">
            `;
        }
    }

function buildStructuredBackendQuery(rawSpec, state, city, rawKw, rawNegatives) {
    let structuredTerms = [];

    // Checkbox states
    const filterJobs = document.getElementById('filterJobEngines').checked;
    const filterDirs = document.getElementById('filterDirectories').checked;
    const filterSocial = document.getElementById('filterSocial').checked;
    const invertMode = document.getElementById('invertFilter').checked;

    // Category Site Arrays
    const jobsSites = ["linkedin.com", "indeed.com", "glassdoor.com", "ziprecruiter.com", "monster.com", "simplyhired.com"];
    const dirSites = ["zocdoc.com", "yelp.com", "healthgrades.com", "vitals.com", "ratemds.com", "yellowpages.com"];
    const socialSites = ["facebook.com", "instagram.com", "twitter.com", "x.com", "linkedin.com", "tiktok.com"];

    // 1. Specialty
    if (rawSpec.trim()) {
        const cleanSpec = rawSpec.trim().toLowerCase();
        const specMap = {
            'chiropractor': '(Chiropractor OR Chiropractic)',
            'chiro': '(Chiropractor OR Chiropractic)',
            'md': '(MD OR Physician OR Doctor)',
            'physical therapy': '("Physical Therapy" OR PT)',
            'pain management': '"Pain Management"',
            'orthopedic': 'Orthopedic'
        };
        structuredTerms.push(specMap[cleanSpec] || `"${rawSpec.trim()}"`);
    }

    // 2. Location
    if (city && state) {
        structuredTerms.push(`"${city}" "${state}"`);
    } else if (state) {
        structuredTerms.push(`"${state}"`);
    }

    // 3. Keywords
    if (rawKw.trim()) {
        const cleanKw = rawKw.trim().toLowerCase();
        if (cleanKw.includes('work') || cleanKw.includes('comp') || cleanKw.includes('job') || cleanKw.includes('industrial')) {
            structuredTerms.push('("workers compensation" OR "workers comp" OR "workmans comp" OR "work injury")');
        } else if (cleanKw.includes('insur') || cleanKw.includes('hmo') || cleanKw.includes('ppo') || cleanKw.includes('regular')) {
            structuredTerms.push('("accepted insurance" OR "in-network" OR PPO OR HMO)');
        } else if (cleanKw.includes('med legal') || cleanKw.includes('qme') || cleanKw.includes('ime')) {
            structuredTerms.push('(QME OR IME OR "med-legal")');
        } else if (cleanKw.includes('personal injury') || cleanKw.includes('pi') || cleanKw.includes('lien') || cleanKw.includes('accident')) {
            structuredTerms.push('("personal injury" OR "medical lien" OR LOP)');
        } else if (cleanKw.includes('cash') || cleanKw.includes('self pay')) {
            structuredTerms.push('("self-pay" OR "cash pay" OR "direct primary care")');
        } else {
            structuredTerms.push(`"${rawKw.trim()}"`);
        }
    }

    // 4. Invert Mode Logic (Target ONLY checked vs Exclude checked)
    if (invertMode) {
        let allowedSites = [];
        if (filterJobs) allowedSites.push(...jobsSites);
        if (filterDirs) allowedSites.push(...dirSites);
        if (filterSocial) allowedSites.push(...socialSites);

        if (allowedSites.length > 0) {
            const siteQuery = allowedSites.map(s => `site:${s}`).join(' OR ');
            structuredTerms.push(`(${siteQuery})`);
        }
    } else {
        // Exclusion Mode
        let excludedSites = [];
        if (filterJobs) excludedSites.push(...jobsSites, "jobs");
        if (filterDirs) excludedSites.push(...dirSites);
        if (filterSocial) excludedSites.push(...socialSites);

        if (excludedSites.length > 0) {
            const siteQuery = excludedSites.map(s => s.includes('.') ? `-site:${s}` : `-${s}`).join(' ');
            structuredTerms.push(siteQuery);
        }

        // Default strict legal exclusions
        structuredTerms.push('-lawyer -attorney -lawfirm -site:*.law -inurl:attorney -inurl:lawyer');
    }

    // 5. Custom Negatives
    if (rawNegatives.trim()) {
        const formattedNegs = rawNegatives.trim().split(' ')
            .map(n => n.startsWith('-') ? n : `-${n}`)
            .join(' ');
        structuredTerms.push(formattedNegs);
    }

    // Build URL (udm=14 for text results)
    const rawQueryString = structuredTerms.join(' ');
    return `https://www.google.com/search?udm=14&q=${encodeURIComponent(rawQueryString)}`;
}

    function search() {
        const spec = document.getElementById('specialty').value;
        const state = document.getElementById('state').value;
        const city = document.getElementById('city').value;
        const kw = document.getElementById('keyword').value;
        const negs = document.getElementById('negatives').value;
        const filterJobs = document.getElementById('filterJobEngines').checked;

        const targetUrl = buildStructuredBackendQuery(spec, state, city, kw, negs, filterJobs);
        window.open(targetUrl, '_blank');
    }
function toggleInvertMode() {
    const isInverted = document.getElementById('invertFilter').checked;

    const labelJobs = document.getElementById('labelJobEngines');
    const labelDirs = document.getElementById('labelDirectories');
    const labelSocial = document.getElementById('labelSocial');

    if (isInverted) {
        labelJobs.textContent = "Include Job Engines ONLY (LinkedIn, Indeed, Glassdoor, ZipRecruiter)";
        labelDirs.textContent = "Include Directories ONLY (ZocDoc, Yelp, Healthgrades, Vitals, RateMDs)";
        labelSocial.textContent = "Include Social Media ONLY (Facebook, Instagram, LinkedIn, Twitter/X)";
    } else {
        labelJobs.textContent = "Exclude Job Engines (LinkedIn, Indeed, Glassdoor, ZipRecruiter)";
        labelDirs.textContent = "Exclude Directories (ZocDoc, Yelp, Healthgrades, Vitals, RateMDs)";
        labelSocial.textContent = "Exclude Social Media (Facebook, Instagram, LinkedIn, Twitter/X)";
    }
}
    // Initialize locations on document load
    initLocations();
</script>
</body>
</html>
